{% comment %} <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Viewer Timer</title>
</head>
<body>
<h1>Viewer Timer</h1>
<div id="timer">3:00</div>

<script>
let timeLeft = parseInt(localStorage.getItem("timeLeft")) || 180;

function updateDisplay() {
    const minutes = Math.floor(timeLeft / 60);
    const seconds = timeLeft % 60;
    document.getElementById("timer").innerText = `${minutes}:${seconds.toString().padStart(2,'0')}`;
}

updateDisplay();

// Poll localStorage every 100ms for changes
setInterval(() => {
    let newTime = parseInt(localStorage.getItem("timeLeft"));
    if (isNaN(newTime)) newTime = 180; // default 3 min
    if (newTime !== timeLeft) {
        timeLeft = newTime;
        updateDisplay();
    }
}, 100);
</script>
</body>
</html> {% endcomment %}
